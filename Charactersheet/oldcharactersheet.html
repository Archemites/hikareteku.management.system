<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikareteku - Scouter Terminal v13.0</title>
    <style>
        :root {
            --green: #00ff41;
            --dark: #000000;
            --dim-green: rgba(0, 255, 65, 0.2);
            --ki-color: #00e5ff;
            --phys-color: #ff9f43;
            --hp-color: #ff3e3e;
            --zeni: #ffd700;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--dark);
            color: var(--green);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 380px;
            border-right: 2px solid var(--green);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            background: #050505;
        }

        /* MAIN */
        .main-sheet {
            flex-grow: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-sizing: border-box;
        }

        h2 {
            font-size: 0.8em;
            border-bottom: 1px solid var(--green);
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        input,
        select,
        textarea {
            background: var(--dark);
            border: 1px solid var(--green);
            color: var(--green);
            font-family: inherit;
            padding: 5px;
            outline: none;
        }

        .header-input {
            border: none;
            border-bottom: 1px solid var(--green);
            font-size: 1.1em;
            width: 100%;
            text-transform: uppercase;
        }

        /* ATRIBUTOS */
        .attr-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .attr-box {
            border: 1px solid var(--green);
            padding: 5px;
            text-align: center;
            background: rgba(0, 255, 65, 0.05);
        }

        .attr-input {
            border: none;
            font-size: 1.2em;
            width: 40px;
            text-align: center;
            background: transparent;
        }

        /* TAB SYSTEM */
        .tabs-nav {
            display: flex;
            gap: 2px;
            margin-bottom: 0;
        }

        .tab-btn {
            background: #111;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.7em;
        }

        .tab-btn.active {
            background: var(--green);
            color: #000;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            border: 1px solid var(--green);
            padding: 20px;
            background: rgba(0, 15, 0, 0.4);
            flex-grow: 1;
        }

        .tab-content.active {
            display: block;
        }

        /* BARS */
        .stat-row {
            margin-bottom: 25px;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid var(--green);
            margin: 10px 0;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
            width: 100%;
        }

        .hp-fill {
            background: var(--hp-color);
        }

        .ki-fill {
            background: var(--ki-color);
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.7em;
            font-weight: bold;
            color: white;
            line-height: 20px;
            text-shadow: 1px 1px 2px #000;
        }

        /* LOG */
        #roll-log {
            flex-grow: 1;
            border: 1px solid #111;
            padding: 10px;
            font-size: 0.75em;
            overflow-y: auto;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-entry {
            border-left: 3px solid var(--green);
            padding-left: 10px;
        }

        .log-tier {
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            display: block;
        }

        .log-extenso {
            font-size: 0.85em;
            color: #aaa;
            display: block;
            margin-top: 4px;
            line-height: 1.3;
            font-style: italic;
        }

        .btn-small {
            padding: 5px 10px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            font-family: inherit;
        }

        .btn-small:hover {
            background: var(--green);
            color: black;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>[SISTEMA DE TIERS]</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
            <label style="font-size: 0.7em;">DADOS:</label>
            <input type="number" id="dice-qty" value="1" min="1" style="width: 40px;">
            <select id="dice-type" style="flex:1">
                <option value="20" selected>D20</option>
                <option value="12">D12</option>
                <option value="10">D10</option>
                <option value="6">D6</option>
            </select>
        </div>
        <button onclick="roll()"
            style="width: 100%; background: var(--green); color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer;">ROULAR
            DADOS</button>

        <div id="roll-log">
            <div style="color:#222">> SCOUTER PRONTO...</div>
        </div>
    </div>

    <div class="main-sheet">
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div style="flex: 2;">
                <label style="font-size: 0.6em;">GUERREIRO</label>
                <input type="text" value="ZAIKO" class="header-input">
            </div>
            <div style="flex: 1;">
                <label style="font-size: 0.6em;">PDL (EX: 1.5za)</label>
                <input type="text" id="pdl-display" value="999z" class="header-input">
            </div>
        </div>

        <div class="attr-container">
            <div class="attr-box"><span>STR</span><br><input type="number" id="val-STR" value="20" class="attr-input"
                    oninput="updateMods()">
                <div id="mod-STR">+5</div>
            </div>
            <div class="attr-box"><span>INT</span><br><input type="number" id="val-INT" value="20" class="attr-input"
                    oninput="updateMods()">
                <div id="mod-INT">+5</div>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="openTab(event, 'aba-itens')">ITENS</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-tecnicas')">TÉCNICAS</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-status')">ESTATÍSTICAS</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-notas')">NOTAS</button>
        </div>

        <div id="aba-itens" class="tab-content active">
            <div style="margin-bottom: 15px;">
                <label style="color: var(--zeni); font-size: 0.8em; display: block; margin-bottom: 5px;">CARTEIRA
                    (ZENI)</label>
                <input type="text" placeholder="Ex: 50.000"
                    style="color: var(--zeni); border-color: var(--zeni); width: 200px;">
            </div>
            <label style="font-size: 0.8em; display: block; margin-bottom: 5px;">INVENTÁRIO & EQUIPAMENTOS</label>
            <textarea style="width: 100%; height: 250px;" placeholder="Descreva seus itens aqui..."></textarea>
        </div>

        <div id="aba-tecnicas" class="tab-content">
            <button onclick="addTech()"
                style="width:100%; border:1px dashed var(--green); background:transparent; color:var(--green); padding:10px; cursor:pointer; margin-bottom:15px;">+
                REGISTRAR TÉCNICA</button>
            <div id="tech-list"></div>
        </div>

        <div id="aba-status" class="tab-content">
            <div class="stat-row">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <label style="font-size: 0.7em;">VIDA ATUAL / MÁXIMA</label><br>
                        <input type="text" id="hp-curr" value="1000" style="width: 80px;" oninput="updateBars()"> /
                        <input type="text" id="hp-max" value="1000" style="width: 80px;" oninput="updateBars()">
                    </div>
                    <div>
                        <label style="font-size: 0.6em; display: block;">MODIFICAR</label>
                        <input type="text" id="hp-mod" placeholder="Valor" style="width: 60px;">
                        <button class="btn-small" onclick="modStat('hp', 1)">+</button>
                        <button class="btn-small" onclick="modStat('hp', -1)">-</button>
                    </div>
                </div>
                <div class="bar-container">
                    <div id="hp-bar-fill" class="bar-fill hp-fill"></div>
                    <div id="hp-bar-label" class="bar-text">100%</div>
                </div>
            </div>

            <div class="stat-row">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <label style="font-size: 0.7em;">SEGMENTOS DE KI (ATUAL / MÁX)</label><br>
                        <input type="text" id="ki-curr" value="100" style="width: 80px;" oninput="updateBars()"> /
                        <input type="text" id="ki-max" value="100" style="width: 80px;" oninput="updateBars()">
                    </div>
                    <div>
                        <label style="font-size: 0.6em; display: block;">MODIFICAR</label>
                        <input type="text" id="ki-mod" placeholder="Valor" style="width: 60px;">
                        <button class="btn-small" onclick="modStat('ki', 1)">+</button>
                        <button class="btn-small" onclick="modStat('ki', -1)">-</button>
                    </div>
                </div>
                <div class="bar-container">
                    <div id="ki-bar-fill" class="bar-fill ki-fill"></div>
                    <div id="ki-bar-label" class="bar-text">100%</div>
                </div>
            </div>
        </div>

        <div id="aba-notas" class="tab-content">
            <textarea style="width: 100%; height: 350px; border: none; background: #050505;"
                placeholder="Anotações da sessão..."></textarea>
        </div>
    </div>

    <script>
        const prefixosPersonalizados = ["Porri", "Caralh", "Sêmen", "Baz", "Gaz", "Krav", "Mleçuaqu", "Merda", "Fudida", "Netanyahu", "Cazaqu", "Nigga", "Tetra", "Vorthi", "Xantri", "Kravol", "Zyphri", "Dravoki", "Qorvexi", "Tharzul", "Nexari", "Velkrioni", "Zorvasti", "Kryzel", "Morvathi", "Xeltrazi", "Varnoki", "Threxi", "Golvari", "Zykrathi", "Vorquazi", "Draxol", "Kharveni", "Xornavi", "Trevaxi", "Zenthroki", "Morzavi", "Krythul", "Vexori", "Zalgrithi", "Tholvari", "Nexulthi", "Gravexi", "Xarnoki", "Velzorithi", "Drakvori", "Quenthari", "Zyloxi", "Vorzethi", "Krelvaxi", "Thyrgoni", "Xavrothi", "Morgravi", "Zelkrathi", "Vortheni", "Kryvoni", "Draxorithi", "Xanvoreli", "Threxovari", "Golzathi", "Nexorithi", "Varnexi", "Zyvorathi", "Kharzol", "Xelvorithi", "Morqeni", "Dravexori", "Tharnoki", "Velkravi", "Zorqathi", "Kryzolveni", "Vortraxi", "Xenthavori", "Gravorni", "Thalvexi", "Morzexari", "Zyphorathi", "Krenthul", "Xorvathi", "Veltrigoni", "Drakzorithi", "Nexvarothi", "Qorzavi", "Threxigoni", "Varnoktri", "Zelvorithi", "Kryphazori", "Xarnovexi", "Morgrathi", "Vorzenoki", "Draxavi", "Tholzexi", "Zykravori", "Krelthari", "Xavronexi", "Velzarki", "Morvexathi", "Threxulvori", "Gravokzi", "Xantravori", "Zorvenathi", "Krylthazori", "Nexogravi", "Vorthakzili", "Dravenoxi", "Xeltharvexi", "Morzoktri", "Zypharioni", "Qorvazenthi", "Thalgrivori", "Velkrathioni", "Xarnovarithi", "Zenthroxavi", "Bonga", "Tramba", "Flungo", "Xureba", "Zonko", "Blastro", "Pavora", "Gorbu", "Escalha", "Trombo", "Gronfa", "Zabru", "Clontra", "Vamblo", "Furdun", "Glumbo", "Charonfa", "Plastro", "Zambro", "Crungo", "Bulhastro", "Fanglo", "Dramblo", "Xontra", "Trulha", "Gorbla", "Flastron", "Morbega", "Jamblo", "Escatron", "Pambro", "Vlonka", "Grambola", "Chulgo", "Brastilha", "Trombega", "Xablon", "Frandula", "Gromba", "Clastrego", "Zorbulha", "Fangastra", "Trambega", "Plonko", "Escabron", "Vulgatra", "Drongla", "Bafunga", "Chumbra", "Grostilha", "Blongatra", "Xarbulha", "Crastomba", "Zunglo", "Trobunga", "Vastalha", "Glorbega", "Frungatra", "Morlonga", "Trastunga", "Bombastra", "Chalgro", "Escavunga", "Grombala", "Plastrunga", "Brongla", "Xurbonha", "Flambotra", "Crungastra", "Vlontraga", "Zambegra", "Trufalha", "Grumbola", "Jastromba", "Clungatra", "Fangombla", "Trobulha", "Morvangla", "Escabunga", "Drastrolha", "Plungatra", "Brastonga", "Chumbrega", "Xarlumba", "Frastunga", "Zorbangla", "Glastromba", "Vambulega", "Crongastra", "Flungobla", "Trombunga", "Grastrolha", "Escatronga", "Blungavra", "Morbulha", "Chastron", "Vrongala", "Plombega", "Xarfunga", "Trambolga"];
        const escalasPadrao = ["", "Mil", "Milhão", "Bilhão", "Trilhão", "Quadrilhão", "Quintilhão", "Sextilhão", "Septilhão", "Octilhão", "Nonilhão", "Decilhão"];

        function parseTier(input) {
            let clean = String(input).toLowerCase().trim();
            let letters = clean.match(/[a-z]+/);
            if (!letters) return parseFloat(clean) || 0;
            let val = parseFloat(clean.replace(letters[0], "")) || 0;
            let suffix = letters[0];
            let power = (suffix.length === 1) ? suffix.charCodeAt(0) - 96 : 26 + (suffix.charCodeAt(1) - 96);
            return val * Math.pow(1000, power);
        }

        function formatTier(num) {
            if (num === 0) return "0";
            if (num < 1000) return Math.floor(num).toString();
            let power = Math.floor(Math.log10(num) / 3);
            let suffix = (power <= 26) ? String.fromCharCode(96 + power) : "z" + String.fromCharCode(96 + (power - 26));
            let base = (num / Math.pow(1000, power)).toFixed(2);
            return `${base.replace('.00', '')}${suffix}`;
        }

        function modStat(type, direction) {
            const currEl = document.getElementById(type + '-curr');
            const modEl = document.getElementById(type + '-mod');

            let currentVal = parseTier(currEl.value);
            let modVal = parseTier(modEl.value);

            let newVal = currentVal + (modVal * direction);
            if (newVal < 0) newVal = 0;

            currEl.value = formatTier(newVal);
            updateBars();
        }

        function updateBars() {
            ['hp', 'ki'].forEach(stat => {
                const curr = parseTier(document.getElementById(stat + '-curr').value);
                const max = parseTier(document.getElementById(stat + '-max').value);
                const fill = document.getElementById(stat + '-bar-fill');
                const label = document.getElementById(stat + '-bar-label');

                let percent = (max > 0) ? (curr / max) * 100 : 0;
                if (percent > 100) percent = 100;

                fill.style.width = percent + '%';
                label.innerText = Math.floor(percent) + '% (' + formatTier(curr) + ')';
            });
        }

        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        /* LÓGICA DE DADOS E TÉCNICAS (CONSERVADA) */
        function calculateMod(v) { return Math.floor((v - 10) / 2); }
        function updateMods() {
            ['STR', 'INT'].forEach(id => {
                const el = document.getElementById('val-' + id);
                if (el) {
                    const m = calculateMod(parseInt(el.value) || 0);
                    document.getElementById('mod-' + id).innerText = (m >= 0 ? '+' : '') + m;
                }
            });
        }

        function addTech() {
            const list = document.getElementById('tech-list');
            const card = document.createElement('div');
            card.className = 'tech-card';
            card.innerHTML = `
            <div class="tech-row" style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="text" class="tech-name" placeholder="NOME TÉCNICA" style="flex:2">
                <select class="tech-type"><option value="KI">KI</option><option value="FIS">FIS</option></select>
                <button onclick="this.parentElement.parentElement.remove()" style="color:red; background:none; border:none; cursor:pointer;">[X]</button>
            </div>
            <div class="calc-area">
                <label>DADO:</label>
                <input type="number" class="dice-result" value="15" style="width:60px;">
                <button class="btn-use" onclick="executeAttack(this)">USAR</button>
            </div>`;
            list.prepend(card);
        }

        function executeAttack(btn) {
            const card = btn.parentElement.parentElement;
            const name = card.querySelector('.tech-name').value || "ATAQUE";
            const type = card.querySelector('.tech-type').value;
            const diceVal = parseInt(card.querySelector('.dice-result').value) || 0;
            const pdlReal = parseTier(document.getElementById('pdl-display').value);
            const attrKey = (type === 'KI') ? 'INT' : 'STR';
            const mod = calculateMod(parseInt(document.getElementById('val-' + attrKey).value) || 10);
            const rawDamage = (diceVal + mod) * (pdlReal / 95);

            const log = document.getElementById('roll-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderColor = (type === 'KI') ? 'var(--ki-color)' : 'var(--phys-color)';
            entry.innerHTML = `<small style="color:#555">>> ${name.toUpperCase()}</small><span class="log-tier">${formatTier(rawDamage)} DANO</span>`;
            log.prepend(entry);
        }

        function roll() {
            const qty = parseInt(document.getElementById('dice-qty').value) || 1;
            const type = parseInt(document.getElementById('dice-type').value);
            let sum = 0;
            for (let i = 0; i < qty; i++) sum += Math.floor(Math.random() * type) + 1;
            const log = document.getElementById('roll-log');
            const entry = document.createElement('div');
            entry.innerHTML = `> SCAN: ${sum}`;
            log.prepend(entry);
        }

        updateBars();
        addTech();
    </script>
</body>

</html>
