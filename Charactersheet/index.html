<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikareteku - Ficha de Personagem v14.0</title>
    <meta name="description" content="Terminal de gerenciamento de guerreiro Scouter Management System.">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="boot-anim">
    <canvas id="particle-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
    <aside class="sidebar" id="sidebar">
        <header>
            <h2 style="font-size:0.75rem;letter-spacing:4px;">[FICHA DE PERSONAGEM]</h2>
        </header>
        <section class="dice-roller">
            <label>Configuração de Dados</label>
            <div style="display:flex;gap:10px;margin-bottom:10px;">
                <input type="number" id="dice-qty" value="1" min="1" style="width:60px;">
                <select id="dice-type" style="flex:1;">
                    <option value="20" selected>D20 (Padrão)</option>
                    <option value="12">D12</option>
                    <option value="10">D10</option>
                    <option value="8">D8</option>
                    <option value="6">D6</option>
                    <option value="4">D4</option>
                </select>
            </div>
            <button class="btn-primary" onclick="roll()">EXECUTAR ROLAGEM</button>
        </section>
        <section class="log-container" style="flex-grow:1;display:flex;flex-direction:column;">
            <h2>[LOG DE TRANSMISSÃO]</h2>
            <div id="roll-log">
                <div class="log-entry-simple">> AGUARDANDO DADOS...</div>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px; margin-top:10px;">
                <button class="btn-delete" onclick="limparLog()" style="width:100%;font-size:0.6rem;letter-spacing:1px;">LIMPAR LOG DE ROLAGENS</button>
                <button class="btn-return" onclick="triggerNav(event, '../index.html')" style="width:100%;font-size:0.7rem;background:var(--alien-glow);color:var(--alien-deep);font-weight:900;text-transform:uppercase;border-color:var(--alien-dim);">VOLTAR</button>
            </div>
        </section>
    </aside>
    <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Retrair painel">⟨</button>
    <main class="main-sheet">
        <div class="sync-status-bar">
            <span class="sync-led" id="sync-led"></span>
            <span class="sync-text" id="sync-text">SINC. INATIVA</span>
        </div>
        <header class="sheet-header">
            <div class="header-group" style="flex:2;">
                <label>Identificação do Guerreiro</label>
                <input type="text" id="char-name" value="ZAIKO" class="header-input" spellcheck="false">
            </div>
            <div class="header-group">
                <label>Tipo de Ki</label>
                <select id="ki-type-select" class="header-input" onchange="updateKiTheme()">
                    <option value="normal">Ki Normal</option>
                    <option value="maligno">Ki Maligno</option>
                    <option value="purificado">Ki Purificado</option>
                    <option value="primitivo">Ki Primitivo</option>
                </select>
            </div>
            <div class="header-group">
                <label>Potência de Luta (PDL)</label>
                <input type="text" id="pdl-display" value="999z" class="header-input" spellcheck="false">
            </div>
        </header>
        <section class="attr-grid">
            <div class="attr-card"><span class="attr-label">STR</span><input type="number" id="val-STR" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-STR">+0</div></div>
            <div class="attr-card"><span class="attr-label">PER</span><input type="number" id="val-PER" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-PER">+0</div></div>
            <div class="attr-card"><span class="attr-label">END</span><input type="number" id="val-END" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-END">+0</div></div>
            <div class="attr-card"><span class="attr-label">CHA</span><input type="number" id="val-CHA" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-CHA">+0</div></div>
            <div class="attr-card"><span class="attr-label">INT</span><input type="number" id="val-INT" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-INT">+0</div></div>
            <div class="attr-card"><span class="attr-label">AGI</span><input type="number" id="val-AGI" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-AGI">+0</div></div>
            <div class="attr-card"><span class="attr-label">LUK</span><input type="number" id="val-LUK" value="10" class="attr-val" oninput="updateMods()"><div class="attr-mod" id="mod-LUK">+0</div></div>
        </section>
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="openTab(event, 'aba-itens')">Inventário</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-tecnicas')">Arsenal</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-status')">Status</button>
            <button class="tab-btn" onclick="openTab(event, 'aba-notas')">Protocolos</button>
        </nav>
        <div id="aba-itens" class="tab-content active">
            <div style="margin-bottom:20px;">
                <label style="color:var(--zeni-gold);font-size:0.6rem;letter-spacing:2px;">ZENI</label>
                <input type="number" id="zeni-val" placeholder="Ex: 50000" style="color:var(--zeni-gold);border-color:rgba(255,215,0,0.3);width:250px;display:block;margin-top:5px;" min="0" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>
            <label style="font-size:0.6rem;letter-spacing:2px;color:var(--alien-dim);">MÓDULOS & EQUIPAMENTOS</label>
            <textarea id="inventory-val" style="width:100%;height:280px;margin-top:10px;" placeholder="Liste seus itens e equipamentos aqui..."></textarea>
        </div>
        <div id="aba-tecnicas" class="tab-content">
            <div class="tech-form-container">
                <h2>[NOVA TÉCNICA]</h2>
                <div class="input-group"><label style="font-size:0.55rem;">NOME DA TÉCNICA</label><input type="text" id="form-name" placeholder="Ex: Galick Gun" style="width:100%;"></div>
                <div style="display:flex;gap:10px;">
                    <div style="flex:1;"><label style="font-size:0.55rem;">TIPO</label><select id="form-type" style="width:100%;"><option value="KI">KI</option><option value="FIS">FÍSICA</option></select></div>
                    <div style="flex:1;text-align:center;"><label style="font-size:0.55rem;">DANO?</label><label class="switch" style="display:block;margin:10px auto 0;"><input type="checkbox" id="form-has-damage" checked><span class="slider"></span></label></div>
                </div>
                <div class="input-group"><label style="font-size:0.55rem;">EFEITO SECUNDÁRIO</label><select id="form-effect" style="width:100%;"><option value="NONE">NENHUM</option><option value="PIERCE">PERFURAÇÃO</option><option value="EXPLODE">EXPLOSÃO</option><option value="STUN">PARALISIA</option><option value="TRACK">RASTREADOR</option></select></div>
                <div class="input-group"><label style="font-size:0.55rem;">DESCRIÇÃO</label><textarea id="form-desc" style="width:100%;height:60px;font-size:0.7rem;"></textarea></div>
                <button class="btn-primary" onclick="saveNewTech()">ADICIONAR AO ARSENAL</button>
            </div>
            <div id="tech-list" class="tech-grid"></div>
        </div>
        <div id="aba-status" class="tab-content">
            <section class="status-section">
                <div class="status-row">
                    <div class="status-meta"><span class="status-label">INTEGRIDADE ESTRUTURAL (HP)</span><div class="status-inputs"><input type="text" id="hp-curr" value="1000" oninput="updateBars()"><span style="color:var(--alien-faint);">/</span><input type="text" id="hp-max" value="1000" oninput="updateBars()"></div></div>
                    <div class="bar-container"><div id="hp-bar-fill" class="bar-fill hp-fill"></div><div id="hp-bar-label" class="bar-label">100%</div></div>
                    <div style="display:flex;gap:5px;justify-content:flex-end;"><input type="text" id="hp-mod" placeholder="MOD" style="width:60px;font-size:0.7rem;"><button onclick="modStat('hp', 1)">+</button><button onclick="modStat('hp', -1)">-</button></div>
                </div>
                <div class="status-row">
                    <div class="status-meta"><span class="status-label">RESERVA DE ENERGIA (KI)</span><div class="status-inputs"><input type="text" id="ki-curr" value="100" oninput="updateBars()"><span style="color:var(--alien-faint);">/</span><input type="text" id="ki-max" value="100" oninput="updateBars()"></div></div>
                    <div class="bar-container"><div id="ki-bar-fill" class="bar-fill ki-fill"></div><div id="ki-bar-label" class="bar-label">100%</div></div>
                    <div style="display:flex;gap:5px;justify-content:flex-end;"><input type="text" id="ki-mod" placeholder="MOD" style="width:60px;font-size:0.7rem;"><button onclick="modStat('ki', 1)">+</button><button onclick="modStat('ki', -1)">-</button></div>
                </div>
            </section>
        </div>
        <div id="aba-notas" class="tab-content">
            <textarea id="notes-val" style="width:100%;height:400px;background:transparent;border:none;color:var(--alien-glow);font-size:0.9rem;" placeholder="Anotações dos protocolos de missão..."></textarea>
        </div>
    </main>
    <script src="js/utils.js"></script>
    <script src="js/charactersheet.js?v=2"></script>
    <script>
        (function(){
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            class P {
                constructor(){ this.reset(); }
                reset(){ this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.s = Math.random()*2+0.3; this.vx=(Math.random()-.5)*.25; this.vy=(Math.random()-.5)*.25; this.o=Math.random()*.4+.05; this.ph=Math.random()*Math.PI*2; this.ps=Math.random()*.015+.004; }
                update(){ this.x+=this.vx; this.y+=this.vy; this.ph+=this.ps; if(this.x<-5||this.x>canvas.width+5||this.y<-5||this.y>canvas.height+5) this.reset(); }
                draw(){ const g=Math.sin(this.ph)*.3+.7; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fillStyle=`rgba(0,255,136,${this.o*g})`; ctx.shadowBlur=this.s*5; ctx.shadowColor='rgba(0,255,136,.25)'; ctx.fill(); ctx.shadowBlur=0; }
            }
            for(let i=0;i<45;i++) particles.push(new P());
            function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
            animate();
        })();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtxInstance = null;
        function getAudioContext(){ if(!audioCtxInstance) audioCtxInstance = new AudioCtx(); return audioCtxInstance; }
        function playSynthBeep(freq, type, duration, volume){
            try{ const ctx=getAudioContext(); if(ctx.state==='suspended') ctx.resume();
            const osc=ctx.createOscillator(); const gain=ctx.createGain();
            osc.type=type||'sine'; osc.frequency.setValueAtTime(freq||440,ctx.currentTime);
            gain.gain.setValueAtTime(volume||.03,ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(.00001,ctx.currentTime+(duration||.1));
            osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+(duration||.1));
            }catch(e){}
        }
        function triggerNav(e, url) {
            e.preventDefault();
            playSynthBeep(440,'sawtooth',.15,.03); playSynthBeep(330,'square',.2,.04);
            document.body.style.opacity = '0';
            document.body.style.filter = 'brightness(0) blur(8px)';
            
            // Xenogate toggle button bypass for fade-out
            const btn = document.getElementById('sidebar-toggle');
            if (btn) {
                btn.style.animation = 'none';
            }

            setTimeout(()=>{ window.location.href=url; },300);
        }
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('sidebar-toggle');
            const collapsed = sidebar.classList.toggle('collapsed');
            btn.classList.toggle('collapsed', collapsed);
            btn.textContent = collapsed ? '⟩' : '⟨';
        }
    </script>
</body>
</html>
